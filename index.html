<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Ahorcado – Corrida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --rouge: #a50f19;
    --rouge-fonce: #5e060c;
    --or: #e2b13c;
    --or-clair: #f6d98a;
    --creme: #fbf1dc;
    --encre: #2b1a10;
    --sable: #d9a868;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Playfair Display", Georgia, serif;
    color: var(--encre);
    min-height: 100vh;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 32px 14px 60px;
    background:
      radial-gradient(ellipse at 50% 110%, var(--sable) 0 30%, transparent 31%),
      repeating-conic-gradient(from 0deg at 50% 0%, var(--rouge) 0deg 8deg, var(--rouge-fonce) 8deg 16deg);
    background-attachment: fixed;
  }

  /* --- L'affiche (cartel) --- */
  .cartel {
    position: relative;
    width: 100%; max-width: 680px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.6), transparent 60%),
      var(--creme);
    border: 6px solid var(--or);
    outline: 3px solid var(--rouge);
    outline-offset: -14px;
    border-radius: 14px;
    padding: 34px 28px 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45), inset 0 0 60px rgba(165,15,25,.12);
    text-align: center;
    overflow: hidden;
  }
  .coin {
    position: absolute; width: 46px; height: 46px; color: var(--rouge);
  }
  .coin.tl { top: 18px; left: 18px; }
  .coin.tr { top: 18px; right: 18px; transform: scaleX(-1); }
  .coin.bl { bottom: 18px; left: 18px; transform: scaleY(-1); }
  .coin.br { bottom: 18px; right: 18px; transform: scale(-1,-1); }

  .plaza {
    font-size: .85rem; letter-spacing: 6px; text-transform: uppercase;
    color: var(--rouge); margin-bottom: 4px;
  }
  h1 {
    font-family: "Rye", serif; font-weight: normal;
    font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05;
    color: var(--rouge);
    text-shadow: 2px 2px 0 var(--or-clair), 4px 4px 0 rgba(0,0,0,.12);
  }
  .ornement {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin: 12px auto 6px; color: var(--or);
  }
  .ornement::before, .ornement::after {
    content: ""; height: 2px; width: 90px;
    background: linear-gradient(90deg, transparent, var(--or));
  }
  .ornement::after { transform: scaleX(-1); }
  .ornement svg { width: 54px; height: 34px; }
  .sub { font-style: italic; color: #7a4a20; margin-bottom: 18px; }

  /* Fanions */
  .fanions {
    display: flex; justify-content: center; gap: 4px; margin: 0 auto 22px;
  }
  .fanions span {
    width: 26px; height: 22px;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: var(--rouge);
  }
  .fanions span:nth-child(even) { background: var(--or); }

  /* Progression */
  .etapes { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
  .etapes div {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--rouge); color: var(--rouge);
    display: grid; place-items: center; font-weight: 600;
    background: #fff;
  }
  .etapes div.actif { background: var(--rouge); color: #fff; box-shadow: 0 0 0 4px var(--or-clair); }
  .etapes div.fait { background: var(--or); border-color: var(--or); color: var(--encre); }

  /* Scène */
  .scene {
    display: flex; align-items: center; justify-content: center; gap: 22px;
    flex-wrap: wrap; margin: 6px 0 4px;
  }
  .potence {
    width: 210px; height: 210px;
    background: radial-gradient(circle at 50% 95%, #e8c48c 0 35%, transparent 36%);
  }
  .potence .p { opacity: 0; transition: opacity .35s, transform .35s; transform-box: fill-box; transform-origin: center; transform: scale(.6); }
  .potence .p.on { opacity: 1; transform: scale(1); }
  .potence .bois { stroke: #4a2a12; stroke-width: 5; fill: none; stroke-linecap: round; }
  .potence .trait { stroke: #2b1a10; stroke-width: 1.5; stroke-linejoin: round; }

  .vies { min-width: 140px; }
  .vies .label { font-size: .8rem; text-transform: uppercase; letter-spacing: 2px; color: #7a4a20; }
  .cornes { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; max-width: 150px; margin-top: 6px; }
  .cornes svg { width: 24px; height: 18px; color: var(--rouge); transition: opacity .3s, transform .3s; }
  .cornes svg.perdue { opacity: .18; transform: scale(.8); }

  /* Mot */
  .mot {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    margin: 20px 0 22px;
  }
  .mot span {
    width: 38px; height: 50px;
    display: grid; place-items: center;
    font-family: "Rye", serif; font-size: 1.8rem; color: var(--rouge);
    border-bottom: 4px solid var(--encre);
  }
  .mot span.vu { animation: pop .35s ease; }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }

  /* Clavier */
  .clavier { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; max-width: 560px; margin: 0 auto; }
  .clavier button {
    width: 42px; height: 46px; font-family: "Playfair Display", serif;
    font-size: 1.15rem; font-weight: 600;
    border: 2px solid var(--rouge); background: #fff; color: var(--rouge);
    border-radius: 8px; cursor: pointer;
    box-shadow: 0 3px 0 var(--rouge-fonce);
    transition: transform .1s, background .15s;
  }
  .clavier button:hover:not(:disabled) { background: var(--rouge); color: #fff; transform: translateY(-2px); }
  .clavier button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--rouge-fonce); }
  .clavier button:disabled { cursor: default; box-shadow: none; }
  .clavier button.ok:disabled { background: var(--or); border-color: var(--or); color: var(--encre); }
  .clavier button.ko:disabled { background: #e9dcc4; border-color: #c9b89a; color: #a8957a; text-decoration: line-through; }

  .msg { min-height: 36px; margin: 20px 0 10px; font-family: "Rye", serif; font-size: 1.5rem; }
  .msg.win { color: var(--rouge); }
  .msg.lose { color: var(--rouge-fonce); }
  .action {
    padding: 12px 28px; font-family: "Rye", serif; font-size: 1.05rem;
    background: var(--rouge); color: #fff; border: 3px solid var(--or);
    border-radius: 40px; cursor: pointer; display: none;
    box-shadow: 0 4px 0 var(--rouge-fonce);
  }
  .action:hover { background: var(--rouge-fonce); }
  .action.show { display: inline-block; animation: pop .4s ease; }

  /* Pétales/confettis de victoire */
  .confetti {
    position: fixed; top: -50px; pointer-events: none; z-index: 10;
    animation: tombe linear forwards;
  }
  @keyframes tombe { to { transform: translateY(110vh) rotate(720deg); opacity: .8; } }


  /* Taureau qui passe */
  .toro {
    position: fixed; bottom: 8px; left: 0; width: 140px; height: 94px;
    pointer-events: none; z-index: 5;
    transform: translateX(-200px);
    filter: drop-shadow(0 4px 2px rgba(0,0,0,.35));
  }
  .toro .pata { transform-box: fill-box; transform-origin: top center; }
  .toro.marche .pata.a { animation: pas .5s ease-in-out infinite alternate; }
  .toro.marche .pata.b { animation: pas .5s ease-in-out infinite alternate-reverse; }
  @keyframes pas { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  .toro.marche .cuerpo { animation: rebote .25s ease-in-out infinite alternate; }
  @keyframes rebote { to { transform: translateY(-1.5px); } }
  .toro .cabeza { transform-box: view-box; transform-origin: 92px 40px; transition: transform .6s ease; }
  .toro.mira .cabeza { transform: rotate(-24deg); }
  .toro .cola { transform-box: view-box; transform-origin: 22px 34px; animation: cola 1.2s ease-in-out infinite alternate; }
  @keyframes cola { to { transform: rotate(18deg); } }
  .toro .bulle { opacity: 0; transition: opacity .3s; }
  .toro.mira .bulle { opacity: 1; }

  .toro.corre .pata.a { animation: pas .18s ease-in-out infinite alternate; }
  .toro.corre .pata.b { animation: pas .18s ease-in-out infinite alternate-reverse; }
  .toro.corre .cuerpo { animation: rebote .12s ease-in-out infinite alternate; }
  .toro.corre .bulle { opacity: 1; }

  /* Torero à cheval */
  .jinete {
    position: fixed; bottom: 6px; left: 0; width: 200px; height: 158px;
    pointer-events: none; z-index: 5;
    transform: translateX(-260px);
    filter: drop-shadow(0 4px 2px rgba(0,0,0,.35));
  }
  .jinete .pata { transform-box: fill-box; transform-origin: top center; }
  .jinete.galopa .pata.a { animation: galop .22s ease-in-out infinite alternate; }
  .jinete.galopa .pata.b { animation: galop .22s ease-in-out infinite alternate-reverse; }
  @keyframes galop { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
  .jinete.galopa .monta { animation: rebote .22s ease-in-out infinite alternate; }
  .jinete .bandera { transform-box: view-box; transform-origin: 121px 62px; animation: ondea .3s ease-in-out infinite alternate; }
  @keyframes ondea { from { transform: rotate(-8deg) skewX(4deg); } to { transform: rotate(10deg) skewX(-6deg); } }

  @media (max-width: 480px) {
    .cartel { padding: 30px 14px 24px; }
    .mot span { width: 28px; height: 40px; font-size: 1.35rem; }
    .clavier button { width: 36px; height: 42px; }
    .coin { width: 32px; height: 32px; }
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- tête de taureau stylisée -->
      <symbol id="cornes" viewBox="0 0 40 30">
        <path fill="currentColor" d="M2 4c3 8 8 11 13 11h10c5 0 10-3 13-11-2 9-6 14-11 15l-2 8h-10l-2-8C8 18 4 13 2 4z"/>
      </symbol>
      <!-- motif d'angle -->

  <main class="cartel">

    <p class="plaza">Plaza de Toros · Gran Corrida</p>

    <div class="ornement"><svg><use href="#cornes"/></svg></div>
    <p class="sub">Adivina las tres palabras de la plaza. ¡Suerte!</p>
    <div class="fanions" id="fanions"></div>

    <div class="etapes" id="etapes"></div>

    <div class="scene">
      <svg class="potence" viewBox="0 0 200 200">
        <defs>

        <!-- 5 : tête avec moustache -->
        <g class="p">
          <circle cx="140" cy="55" r="13" fill="#e9b98a" class="trait"/>

        </g>

        <g class="p">
          <path d="M120 47 Q119 36 129 38 Q133 30 140 30 Q147 30 151 38 Q161 36 160 47 Q140 41 120 47Z" fill="#1a1a1a" class="trait"/>
          <circle cx="120" cy="47" r="3.5" fill="#1a1a1a"/>
          <circle cx="160" cy="47" r="3.5" fill="#1a1a1a"/>
          <path d="M126 44 Q140 39 154 44" stroke="#e2b13c" stroke-width="1.5" fill="none"/>
        </g>
        <!-- 7 : poncho -->
        <g class="p">
          <path d="M131 68 L149 68 L172 116 L108 116 Z" fill="url(#rayures)" class="trait"/>
          <path d="M108 116 v5 M114 116 v5 M120 116 v5 M126 116 v5 M132 116 v5 M138 116 v5 M144 116 v5 M150 116 v5 M156 116 v5 M162 116 v5 M168 116 v5 M172 116 v5"
                stroke="#e2b13c" stroke-width="1.5"/>
          <path d="M134 68 Q140 74 146 68" fill="#e9b98a" class="trait"/>
        </g>
        <!-- 8 : bras -->
        <g class="p">
          <path d="M120 96 L106 114" stroke="#e9b98a" stroke-width="5" stroke-linecap="round"/>
          <path d="M160 96 L174 114" stroke="#e9b98a" stroke-width="5" stroke-linecap="round"/>
        </g>
        <!-- 9 : jambe + botte gauche -->
        <g class="p">
          <path d="M134 116 L131 144" stroke="#2c4a7a" stroke-width="7" stroke-linecap="round"/>
          <path d="M125 141 H137 L137 160 H130 L129 163 H126 L125 160 H117 Q110 160 114 156 L125 154 Z" fill="#7a4a20" class="trait"/>
          <path d="M126 146 H136" stroke="#e2b13c" stroke-width="1.5"/>
        </g>
        <!-- 10 : jambe + botte droite -->
        <g class="p">
          <path d="M146 116 L149 144" stroke="#2c4a7a" stroke-width="7" stroke-linecap="round"/>
          <path d="M155 141 H143 L143 160 H150 L151 163 H154 L155 160 H163 Q170 160 166 156 L155 154 Z" fill="#7a4a20" class="trait"/>
          <path d="M144 146 H154" stroke="#e2b13c" stroke-width="1.5"/>
        </g>
      </svg>
      <div class="vies">
        <div class="label">Vidas restantes</div>
        <div class="cornes" id="cornes"></div>
      </div>
    </div>

    <div class="mot" id="mot"></div>
    <div class="clavier" id="clavier"></div>
    <div class="msg" id="msg"></div>
    <button class="action" id="action"></button>
  </main>


  <svg class="toro" id="toro" viewBox="0 0 140 94" aria-hidden="true">
    <g class="cuerpo">
      <path class="cola" d="M24 36 Q10 44 12 64" stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle class="cola" cx="12" cy="66" r="3.5" fill="#151515"/>
      <rect class="pata a" x="28" y="54" width="8" height="28" rx="3" fill="#151515"/>
      <rect class="pata b" x="40" y="54" width="8" height="28" rx="3" fill="#0a0a0a"/>

      <rect class="pata a" x="84" y="54" width="8" height="28" rx="3" fill="#0a0a0a"/>
      <path d="M22 40 Q22 26 40 26 Q60 18 82 24 Q96 28 96 44 Q96 60 80 62 L36 62 Q22 60 22 40Z" fill="#151515"/>
      <g class="cabeza">
        <path d="M88 30 Q100 24 112 32 L120 50 Q121 58 113 58 L104 56 Q92 50 88 40Z" fill="#151515"/>
        <ellipse cx="115" cy="55" rx="6" ry="4" fill="#3a2a22"/>
        <circle cx="107" cy="38" r="2.2" fill="#fff"/>
        <circle cx="107.6" cy="37.6" r="1.1" fill="#000"/>
        <path d="M98 30 Q96 18 106 12 Q101 20 104 29Z" fill="#f3ead8" stroke="#151515" stroke-width=".8"/>
        <path d="M104 31 Q108 20 118 18 Q111 24 110 32Z" fill="#f3ead8" stroke="#151515" stroke-width=".8"/>
        <g class="bulle">
          <circle cx="126" cy="14" r="11" fill="#fff" stroke="#a50f19" stroke-width="1.5"/>
          <text id="bulleTxt" x="126" y="19" text-anchor="middle" font-size="14" font-family="Rye, serif" fill="#a50f19">¿?</text>
        </g>
      </g>
    </g>
  </svg>

  <svg class="jinete" id="jinete" viewBox="0 0 200 158" aria-hidden="true">
    <g class="monta">
      <!-- queue -->
      <path d="M48 86 Q28 92 30 122 Q38 104 50 96Z" fill="#2a1608"/>
      <!-- pattes -->
      <rect class="pata a" x="56" y="98" width="9" height="44" rx="3" fill="#5a3216"/>
      <rect class="pata b" x="68" y="98" width="9" height="44" rx="3" fill="#4a2810"/>
      <rect class="pata b" x="112" y="98" width="9" height="44" rx="3" fill="#5a3216"/>
      <rect class="pata a" x="124" y="98" width="9" height="44" rx="3" fill="#4a2810"/>
      <!-- corps + cou + tête du cheval -->
      <ellipse cx="92" cy="92" rx="48" ry="20" fill="#6b3e1e"/>
      <path d="M124 84 Q132 62 146 52 L156 60 Q146 74 140 96Z" fill="#6b3e1e"/>
      <path d="M142 50 Q152 40 160 46 L178 66 Q182 74 174 76 L160 72 Q150 66 146 58Z" fill="#6b3e1e"/>
      <path d="M140 52 Q146 44 152 44 L150 50 Q144 56 136 74 Q132 64 140 52Z" fill="#2a1608"/>
      <path d="M150 44 L152 36 L156 44Z" fill="#6b3e1e"/>
      <circle cx="160" cy="55" r="1.8" fill="#000"/>
      <!-- selle -->
      <path d="M76 74 Q92 68 108 74 L106 84 L78 84Z" fill="#a50f19" stroke="#e2b13c" stroke-width="1.5"/>
      <!-- cavalier -->
      <rect x="92" y="78" width="8" height="24" rx="3" fill="#1d1d1d"/>
      <path d="M90 100 H102 V106 H88 Q84 106 86 102Z" fill="#7a4a20"/>
      <path d="M84 50 Q92 44 102 50 L104 78 H84Z" fill="#a50f19" stroke="#e2b13c" stroke-width="1.5"/>
      <path d="M88 54 V76 M100 54 V76" stroke="#e2b13c" stroke-width="1.2"/>
      <!-- muleta rouge tenue en main -->
      <path class="bandera" d="M118 62 Q132 60 146 66 Q154 90 146 116 Q130 124 112 116 Q106 104 110 92 Q116 78 118 62Z" fill="#c8101c" stroke="#7a0a10" stroke-width="1.2"/>
      <path d="M124 66 Q128 90 124 114 M136 66 Q142 90 138 116" stroke="#8e0b14" stroke-width="1" fill="none"/>
      <path d="M100 54 L120 62" stroke="#a50f19" stroke-width="5" stroke-linecap="round"/>
      <circle cx="121" cy="62" r="3.2" fill="#e9b98a"/>
      <circle cx="93" cy="40" r="8" fill="#e9b98a"/>
      <circle cx="96" cy="39" r="1.2" fill="#000"/>
      <path d="M82 34 Q82 26 88 28 Q93 22 98 28 Q104 26 104 34 Q93 30 82 34Z" fill="#1a1a1a"/>
      <circle cx="82" cy="34" r="2.5" fill="#1a1a1a"/>
      <circle cx="104" cy="34" r="2.5" fill="#1a1a1a"/>
    </g>
  </svg>

<script>
  const MOTS = ["BANDERILLAS", "TRADICIÓN", "TORERO"];
  const MAX = 10;
  const base = c => c.normalize("NFD").replace(/[̀-ͯ]/g, "");
  const $ = id => document.getElementById(id);

  $("fanions").innerHTML = "<span></span>".repeat(14);

  let i = 0, trouvees, erreurs, fini, dejaVu;

  function nouveauMot() {
    trouvees = new Set(); dejaVu = new Set(); erreurs = 0; fini = false;
    $("msg").textContent = ""; $("msg").className = "msg";
    $("action").className = "action";
    $("etapes").innerHTML = MOTS.map((_, k) =>
      `<div class="${k < i ? "fait" : k === i ? "actif" : ""}">${k + 1}</div>`).join("");
    $("cornes").innerHTML = Array.from({ length: MAX },
      () => '<svg><use href="#cornes"/></svg>').join("");
    $("clavier").innerHTML = "";
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(l => {
      const b = document.createElement("button");
      b.textContent = l; b.id = "k" + l;
      b.onclick = () => jouer(l);
      $("clavier").appendChild(b);
    });
    afficher();
  }

  function jouer(l) {
    if (fini || trouvees.has(l)) return;
    trouvees.add(l);
    const btn = $("k" + l);
    btn.disabled = true;
    if ([...MOTS[i]].some(c => base(c) === l)) btn.classList.add("ok");
    else { erreurs++; btn.classList.add("ko"); }
    afficher();
  }

  function afficher() {
    const mot = MOTS[i];
    $("mot").innerHTML = [...mot].map((c, k) => {
      const visible = trouvees.has(base(c));
      const nouveau = visible && !dejaVu.has(k);
      if (visible) dejaVu.add(k);
      return `<span class="${nouveau ? "vu" : ""}">${visible ? c : ""}</span>`;
    }).join("");
    document.querySelectorAll(".potence .p").forEach((p, k) => p.classList.toggle("on", k < erreurs));
    document.querySelectorAll("#cornes svg").forEach((s, k) => s.classList.toggle("perdue", k >= MAX - erreurs));

    const gagne = [...mot].every(c => trouvees.has(base(c)));
    const action = $("action"), msg = $("msg");
    if (gagne) {
      fini = true;
      msg.className = "msg win";
      confettis();
      if (i < MOTS.length - 1) {
        msg.textContent = "¡Olé! ¡Muy bien!";
        action.textContent = "Siguiente palabra →";
        action.onclick = () => { i++; nouveauMot(); };
      } else {
        msg.textContent = "¡Olé, olé! ¡Has encontrado las 3 palabras! 🏆";
        action.textContent = "Jugar otra vez";
        action.onclick = () => { i = 0; nouveauMot(); };
      }
      action.className = "action show";
    } else if (erreurs >= MAX) {
      fini = true;
      msg.className = "msg lose";
      msg.textContent = `¡Has perdido! Era: ${mot}`;
      action.textContent = "Reintentar";
      action.onclick = nouveauMot;
      action.className = "action show";
    }
  }

  function confettis() {
    const emojis = ["🐄", "🐮", "🐂", "🇪🇸", "🇪🇸"];
    for (let n = 0; n < 80; n++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.textContent = emojis[n % emojis.length];
      c.style.fontSize = 22 + Math.random() * 22 + "px";
      c.style.animationDuration = 2 + Math.random() * 2 + "s";
      c.style.animationDelay = Math.random() * .6 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  document.addEventListener("keydown", e => {
    const l = base(e.key.toUpperCase());
    if (/^[A-Z]$/.test(l)) jouer(l);
    else if (e.key === "Enter" && fini) $("action").click();
  });

  nouveauMot();

  // Le taureau passe, regarde le pendu ; au milieu, un torero à cheval surgit et le taureau fuit
  (function () {
    const toro = $("toro"), jinete = $("jinete"), bulle = $("bulleTxt");
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let x, xj, arret, phase, t0;
    const etat = (el, ...cls) => { el.classList.remove("marche", "mira", "corre", "galopa"); el.classList.add(...cls); };
    function depart() {
      x = -160; xj = -260; phase = "va";
      const carte = document.querySelector(".cartel").getBoundingClientRect();
      arret = Math.max(10, carte.left - 150);
      bulle.textContent = "¿?";
      etat(toro, "marche");
      jinete.style.transform = `translateX(${xj}px)`;
      requestAnimationFrame(boucle);
    }
    function boucle(t) {
      const milieu = innerWidth / 2 - 70;
      if (phase === "va") {
        x += 1.6;
        if (x >= arret) { phase = "mira"; t0 = t; etat(toro, "mira"); }
      } else if (phase === "mira") {
        if (t - t0 > 2800) { phase = "sale"; etat(toro, "marche"); }
      } else if (phase === "sale") {
        x += 2.2;
        if (x >= milieu) { phase = "huye"; bulle.textContent = "¡!"; etat(toro, "corre"); etat(jinete, "galopa"); }
      } else {
        x += 7.5;
        xj += 7;
        jinete.style.transform = `translateX(${xj}px)`;
        if (xj > innerWidth + 20) {
          etat(toro); etat(jinete);
          setTimeout(depart, 7000); return;
        }
      }
      toro.style.transform = `translateX(${x}px)`;
      requestAnimationFrame(boucle);
    }
    setTimeout(depart, 1500);
  })();
</script>
</body>
</html>
